<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Loja de Roupas</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" />
</head>

<body>

<div class="layout">

    <!-- Conteúdo -->
    <div class="conteudo">

        <!-- Topo -->
        <header class="topo-dashboard">
            <div class="pesquisa-dashboard">
                <input type="text" placeholder="Pesquisar...">
                <span class="icone-pesquisa">🔍</span>
            </div>
            <div class="perfil-dashboard">
                <img src="mg-logo.jpg" class="foto-perfil-dashboard">
            </div>
        </header>

        <!-- Parte Central -->
        <main id="dashboard">

            <!-- Métricas superiores -->
            <section id="metricas-superiores">

                <div class="venda-dia">
                    <h3>Vendas Hoje</h3>
                    <p class="valor-diario"></p>
                    <span class="variacao-diario"></span>
                </div>

                <div class="baixo-estoque">
                    <h3>Produtos com Baixo Estoque</h3>
                    <p class="numero-baixo-estoque"></p>
                    <span class="alerta-baixo-estoque"></span>
                </div>

                <div class="itens-estoque">
                    <h3>Itens no Estoque</h3>
                    <p class="quantidade-itens-estoque"></p>
                    <span class="variacao-itens"></span>
                </div>

                <div class="Quantidade-Vendas">
                    <h3>Itens Vendidos Hoje</h3>
                    <p class="numero-vendas"></p>
                </div>

            </section>

            <!-- Conteúdo Central -->
            <section id="centro">

                <div class="Graficos">
                    <h3 class="titulo-grafico"></h3>
                    <div class="img-graficos"></div>
                </div>

                <div class="metricas-laterais">

                    <div class="Produtos-mais-vendidos">
                        <h4>Produtos Mais Vendidos</h4>
                        <p class="mais-vendas"></p>
                    </div>

                    <div class="Produtos-menos-vendidos">
                        <h4>Produtos Menos Vendidos</h4>
                        <p class="menos-vendas"></p>
                    </div>

                    <div class="Categoria-mais-vendida">
                        <h4>Melhor Categoria</h4>
                        <p class="melhor-categoria"></p>
                    </div>

                    <div class="Reabastecimento">
                        <h4>Reabastecimento Urgente</h4>
                        <p class="itens-reabastecimento"></p>
                    </div>

                </div>

            </section>

            <!-- Atalhos -->
            <section class="atalhos">
                <h2>Atalhos Rápidos</h2>

                <div class="grade-atalhos">
                    <div class="Cadastrar-Produtos">Cadastrar Produto</div>
                    <div class="Listar-Produtos">Listar Produtos</div>
                    <div class="Excluir-Produtos">Excluir Produtos</div>
                    <div class="Registrar-Vendas">Registrar Venda</div>
                    <div class="Listar-Vendas">Listar Vendas</div>
                    <div class="Relatorios">Relatórios</div>
                </div>

            </section>

        </main>

    </div><!-- /conteudo -->

</div><!-- /layout -->

</body>
</html>
