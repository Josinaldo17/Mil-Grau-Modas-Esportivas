<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesPro - Advanced Sales Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar d-flex flex-column" >

    </div>
    <!-- Content Wrapper -->
    <div class="content-wrapper ">
        <!-- Topbar -->
        <nav id='sidebar_navbar' class="navbar  d-flex justify-content-end align-items-center ">
        </nav>

        <!-- Main Content -->
        <main class="container-fluid px-4 py-4">
          

            <div class="container-fluid mt-4">
                <div class="row">
    
                    <!-- Barra lateral de filtros -->
                    <div class="col-md-3 mb-4">
                    <div class="sidebar filtros">
                        <h5 class="mb-3">Filtros</h5>
    
                        <div class="mb-3">
                        <label class="form-label">Buscar Produto</label>
                        <input type="text" id="busca" class="form-control" placeholder="Pesquisar...">
                        </div>
    
                        <div class="mb-3">
                        <label class="form-label">Gênero</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="Feminino" id="feminino">
                            <label class="form-check-label" for="feminino">Feminino</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="Masculino" id="masculino">
                            <label class="form-check-label" for="masculino">Masculino</label>
                        </div>
                        </div>
    
                        <div class="mb-3">
                        <label class="form-label">Tamanho</label>
                        <select class="form-select" id="tamanho">
                            <option selected>Todos</option>
                            <option>36</option>
                            <option>37</option>
                            <option>38</option>
                            <option>39</option>
                            <option>40</option>
                            <option>41</option>
                        </select>
                        </div>
    
                        <div>
                        <label class="form-label">Categoria</label>
                        <select class="form-select" id="categoria">
                            <option selected>Todos</option>
                            <option>Tênis</option>
                            <option>Camiseta</option>
                            <option>Bermuda</option>
                            <option>Jaqueta</option>
                        </select>
                        </div>
                    </div>
                    </div>
    
                    <!-- Área principal -->
                    <div class="col-md-9 d-flex flex-column align-items-center justify-content-center" >
                        <div class="col-md-9 d-flex align-items-center justify-content-between">
                             <h1 class="mb-4 text-center">Produtos</h1>
    
                            <div id="carrinho-fixo" class="btn btn-outline-danger text-danger p-3 rounded">
                                <i class="fas fa-shopping-cart"></i>
                                <span>3 itens</span>
                            </div>
                        </div>
                       
    
                        <div class="container  row overflow-auto  mt-3  " style="height: 70vh;">
    
                            <div class="row d-flex  align-items-center justify-content-center" id="galeria"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            
            
        </main>

        <!-- Footer -->
        <footer id="footer_main" class="footer">
           
        </footer>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

    
    <script>
    // Variáveis
    const LINK_IMAGEM_PADRAO = "https://imgcentauro-a.akamaihd.net/660x660/M17DRV46A4.jpg";
    let link_input = document.getElementById("url");
    let imagens = [];
    let galeria = document.getElementById("galeria");


    // Função para renderizar a galeria
    function renderizarGaleria() {
        galeria.innerHTML = '';

        imagens.forEach((linkDaImagem, index) => {
        let colDiv = document.createElement("div");
        colDiv.className = 'col-6 col-sm-4 col-md-3 mb-4';

        let img = document.createElement("img");
        img.src = linkDaImagem;
        img.alt = 'Imagem do Produto';
        img.className = 'product-img';

        let itemCard = document.createElement("div");
        itemCard.className = 'product-card';
        itemCard.innerHTML = `<p class="mt-2">Item #${index + 1}</p>`;

        let itembnt = document.createElement("button");
        itembnt.className = 'btn btn-success w-100';
        itembnt.textContent = 'Adicionar';



        colDiv.appendChild(img);
        colDiv.appendChild(itemCard);
        colDiv.appendChild(itembnt);
        galeria.appendChild(colDiv);
        });
    }

    // Adiciona alguns itens iniciais para demonstração
    document.addEventListener('DOMContentLoaded', () => {
        imagens.push(LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO, LINK_IMAGEM_PADRAO);
        renderizarGaleria();
    });
    </script>
    <script type="module" src="/src/components/main.js"></script>

</body>
</html>
