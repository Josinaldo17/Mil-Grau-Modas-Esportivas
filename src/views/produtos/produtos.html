<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>produtos</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar d-flex flex-column"></div>
    <!-- Content Wrapper -->
    <div class="content-wrapper">
      <!-- Topbar -->
      <nav
        id="sidebar_navbar"
        class="navbar d-flex justify-content-end align-items-center"
      ></nav>

      <!-- Main Content -->
      <main class="container-fluid px-4 py-4">
        <div class="container-fluid mt-4">
          <div class="row">
            <!-- Barra lateral de filtros -->
            <div class="col-md-3 mb-4">
              <div class="sidebar filtros">
                <h5 class="mb-3">Filtros</h5>

                <div class="mb-3">
                  <label class="form-label">Buscar Produto</label>
                  <input
                    type="text"
                    id="busca"
                    class="form-control"
                    placeholder="Pesquisar..."
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Gênero</label>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Feminino"
                      id="feminino"
                    />
                    <label class="form-check-label" for="feminino"
                      >Feminino</label
                    >
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Masculino"
                      id="masculino"
                    />
                    <label class="form-check-label" for="masculino"
                      >Masculino</label
                    >
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Tamanho</label>
                  <select class="form-select" id="tamanho">
                    <option selected>Todos</option>
                    <option>36</option>
                    <option>37</option>
                    <option>38</option>
                    <option>39</option>
                    <option>40</option>
                    <option>41</option>
                  </select>
                </div>

                <div>
                  <label class="form-label">Categoria</label>
                  <select class="form-select" id="categoria">
                    <option selected>Todos</option>
                    <option>Tênis</option>
                    <option>Camiseta</option>
                    <option>Bermuda</option>
                    <option>Jaqueta</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Área principal -->
            <div
              class="col-md-9 d-flex flex-column align-items-center justify-content-center"
            >
              <div
                class="col-md-9 d-flex align-items-center justify-content-between"
              >
                <h1 class="mb-4 text-center">Produtos</h1>

                <div id="adicionar-produto" class="btn btn-outline-success text-success p-3 rounded d-flex align-items-center gap-2" onclick="abrirModalAdicionar()">
                  <i class="fas fa-plus-circle"></i>
                  <span>Adicionar produto</span>
                </div>
              </div>

              <div
                class="container row overflow-auto mt-3"
                style="height: 70vh"
              >
                <div
                  class="row d-flex align-items-center justify-content-center"
                  id="galeria"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <div class="modal fade" id="modalProduto" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="tituloModal">Produto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="produtoId">

        <div class="mb-3">
          <label>Nome</label>
          <input type="text" id="produtoNome" class="form-control">
        </div>

        <div class="mb-3">
          <label>Preço</label>
          <input type="number" id="produtoPreco" class="form-control">
        </div>

        <div class="mb-3">
          <label>Imagem (URL)</label>
          <input type="text" id="produtoImagem" class="form-control">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarProduto()">Salvar</button>
      </div>

    </div>
  </div>
</div>


      <!-- Footer -->
      <footer id="footer_main" class="footer"></footer>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

    <script>
      // Variáveis
      const LINK_IMAGEM_PADRAO =
        "https://imgcentauro-a.akamaihd.net/660x660/M17DRV46A4.jpg";
      let link_input = document.getElementById("url");
      let imagens = [];
      let galeria = document.getElementById("galeria");

      function renderizarGaleria() {
  galeria.innerHTML = '';

  produtos.forEach(produto => {
    const col = document.createElement('div');
    col.className = 'col-6 col-sm-4 col-md-3 mb-4';

    col.innerHTML = `
      <img src="${produto.imagem}" class="product-img">
      <div class="product-card">
        <p>${produto.nome}</p>
        <p>R$ ${produto.preco}</p>
      </div>
    `;

    // 🔥 BOTÕES DEPENDEM DO MODO
    if (window.MODO_TELA === 'vendas') {
      const btn = document.createElement('button');
      btn.className = 'btn btn-success w-100';
      btn.textContent = 'Adicionar ao carrinho';
      btn.onclick = () => adicionarAoCarrinho(produto.id);
      col.appendChild(btn);
    }

    if (window.MODO_TELA === 'produtos') {
      const btnEditar = document.createElement('button');
      btnEditar.className = 'btn btn-warning w-100 mb-2';
      btnEditar.textContent = 'Editar';
      btnEditar.onclick = () => editarProduto(produto.id);

      const btnAdd = document.createElement('button');
      btnAdd.className = 'btn btn-danger w-100';
      btnAdd.textContent = 'Apagar';
      btnAdd.onclick = () => apagarProduto(produto.id);

      col.appendChild(btnEditar);
      col.appendChild(btnAdd);
    }

    galeria.appendChild(col);
  });
}


      // Adiciona alguns itens iniciais para demonstração
      document.addEventListener("DOMContentLoaded", () => {
        imagens.push(
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
          LINK_IMAGEM_PADRAO,
        );
        renderizarGaleria();
      });
    </script>
    <script type="module" src="/src/components/main.js"></script>
    <script>
      window.MODO_TELA = "produtos";
    </script>
    <script src="produtos.js"></script>
  </body>
</html>
