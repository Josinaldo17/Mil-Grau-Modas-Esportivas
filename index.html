<body>
    <div class="container hero">
        
        <div class="login-card p-5 shadow text-white">
            <div class="d-flex justify-content-center mb-4">
                <div class="col-lg-6 col-md-8 col-sm-10"> 
                    <img src="../src/assets/img/logo.png" alt="Logo Imagem" class="img-fluid" style="width: 100%; height: auto;">
                    <div class="login">Login</div>
                </div>
            </div>
            <form>
                <div class="mb-3 input-group">
                <span class="input-group-text bg-transparent border-0 text-black"><i class="fa fa-user"></i></span>
                <input type="text" class="form-control bg-transparent border-0 border-bottom text-white" placeholder="ID | Usuario">
                </div>
                <div class="mb-3 input-group">
                <span class="input-group-text bg-transparent border-0 text-black"><i class="fa fa-lock"></i></span>
                <input type="password" class="form-control bg-transparent border-0 border-bottom text-white" placeholder="Senha">
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check"></div>
                <a href="#" class="small text-white-50 text-decoration-none">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn btn-warning w-100">LOGIN</button>

            </form>
        </div>
    </div>
