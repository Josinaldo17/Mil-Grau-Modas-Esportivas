<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <!-- Camada de fundo colorida -->
  <div class="bg-color"></div>

  <!-- Camada da imagem usando contain -->
  <div class="bg-image"></div>

  <!-- Camada frontal com o formulário -->
  <div id="Form-Login">
    <div class="Info-SCE">
      <h1>Login</h1>
      <h2>SCE</h2>
      <h2>MIL GRAU</h2>
      <h2>MODA ESPORTIVA</h2>
    </div>
    <div class="form">
      <label for="usuario-form">Usuario:</label>
      <input id="usuario-form" type="text">

      <label for="senha-form">Senha:</label>
      <input id="senha-form" type="password">

      <input type="submit" id="enviar-form" value="Enviar">
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
